<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dutch Flashcards</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f1ea;color:#222;display:flex;flex-direction:column;min-height:100vh}
header{background:#ae1c28;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.1em;margin:0}#timer{font-variant-numeric:tabular-nums;font-weight:bold}
#stats{display:flex;justify-content:space-around;padding:8px;background:#21468b;color:#fff;font-size:.9em}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px}
#card{background:#fff;border-radius:16px;box-shadow:0 2px 10px #0002;width:100%;max-width:480px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;box-sizing:border-box;}
#front{font-size:2em;font-weight:600}#back{font-size:1.1em;color:#666;margin-top:10px}
.hint{color:#999;font-size:.85em;margin-top:14px}
#btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:480px;margin-top:16px}
button{font-size:1em;padding:10px 4px;line-height:1.2;border:0;border-radius:10px;color:#fff;cursor:pointer}
.again{background:#c0392b}.hard{background:#e67e22}.good{background:#27ae60}.easy{background:#2980b9}
#tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}#tools button{background:#555}
button small{display:block;font-size:.7em;opacity:.9;margin-top:2px}.opt{display:block;width:100%;margin-top:8px;background:#eef;color:#222;border:2px solid #ccd;font-size:1.05em}.opt.right{background:#d4f5dd;border-color:#27ae60}.opt.wrong{background:#fadbd8;border-color:#c0392b}#mc{width:100%}#say{background:#ff7f00!important}</style></head><body>
<header><h1>🇳🇱 Dutch Flashcards</h1><span id="timer">15:00</span></header>
<div id="stats"><span>Due: <b id="sDue">0</b></span><span>New left: <b id="sNew">0</b></span><span>Learned: <b id="sLearned">0</b></span><span>Streak: <b id="sStreak">0</b>🔥</span></div>
<main><div id="decks" style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center"><button data-d="phr" style="background:#888">📌 Phrases this week</button><button data-d="top" style="background:#888">📚 Top words</button><button data-d="both" style="background:#888">Both</button></div><div id="card"><div id="front">Loading…</div><div id="back" hidden></div>
<div id="mc"></div>
<div id="typebox" hidden style="margin-top:14px;width:100%"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the Dutch (optional)" style="width:100%;box-sizing:border-box;font-size:1.1em;padding:10px;border:1px solid #ccc;border-radius:8px"><div id="check" style="margin-top:6px;font-weight:600"></div></div>
<div id="exbox" hidden style="margin-top:14px;border-top:1px solid #eee;padding-top:10px;font-size:.95em"><span id="ex"></span> <button id="exsay" style="background:#ff7f00;padding:4px 8px;font-size:.8em">🔊</button><div id="exEn" style="color:#888;font-size:.85em;margin-top:4px"></div></div>
<div class="hint" id="hint"></div></div>
<button id="showbtn" hidden style="background:#21468b;width:100%;max-width:480px;margin-top:16px">Show answer</button>
<button id="cont" hidden style="background:#27ae60;width:100%;max-width:480px;margin-top:16px">Continue →</button>
<div id="more" style="display:none;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center"><button id="more10" style="background:#27ae60">➕ Learn 10 more new cards</button><button id="ahead" style="background:#2980b9">⏩ Review ahead</button></div>
<div id="btns" hidden><button class="again" data-q="0">Again<small id="n0"></small></button><button class="hard" data-q="3">Hard<small id="n3"></small></button><button class="good" data-q="4">Good<small id="n4"></small></button><button class="easy" data-q="5">Easy<small id="n5"></small></button></div>
<div id="tools"><button id="say">🔊 Hear it</button><button id="show">Show answers immediately (easy mode): OFF</button><button id="dir">Direction: Mixed</button></div>
<div id="tools2" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center"><button id="exp" style="background:#21468b">⬆ Export progress</button><button id="imp" style="background:#21468b">⬇ Import progress</button><input type="file" id="impf" accept=".json,.txt" hidden></div></main>
<audio id="aud" preload="none"></audio><script src="app.js"></script></body></html>
