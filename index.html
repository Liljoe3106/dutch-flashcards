<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dutch Flashcards</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f1ea;color:#222;display:flex;flex-direction:column;min-height:100vh}
header{background:#ae1c28;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.1em;margin:0}#timer{font-variant-numeric:tabular-nums;font-weight:bold}
#stats{display:flex;justify-content:space-around;padding:8px;background:#21468b;color:#fff;font-size:.9em}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px}
#card{background:#fff;border-radius:16px;box-shadow:0 2px 10px #0002;width:100%;max-width:480px;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;box-sizing:border-box;cursor:pointer}
#front{font-size:2em;font-weight:600}#back{font-size:1.4em;color:#555;margin-top:16px}
.hint{color:#999;font-size:.85em;margin-top:14px}
#btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:480px;margin-top:16px}
button{font-size:1em;padding:14px 4px;border:0;border-radius:10px;color:#fff;cursor:pointer}
.again{background:#c0392b}.hard{background:#e67e22}.good{background:#27ae60}.easy{background:#2980b9}
#tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}#tools button{background:#555}
#say{background:#ff7f00!important}</style></head><body>
<header><h1>🇳🇱 Dutch Flashcards</h1><span id="timer">15:00</span></header>
<div id="stats"><span>Due: <b id="sDue">0</b></span><span>New left: <b id="sNew">0</b></span><span>Learned: <b id="sLearned">0</b></span><span>Streak: <b id="sStreak">0</b>🔥</span></div>
<main><div id="card"><div id="front">Loading…</div><div id="back" hidden></div><div class="hint" id="hint">Tap to reveal</div></div>
<div id="btns" hidden><button class="again" data-q="0">Again</button><button class="hard" data-q="3">Hard</button><button class="good" data-q="4">Good</button><button class="easy" data-q="5">Easy</button></div>
<div id="tools"><button id="say">🔊 Hear it</button><button id="dir">Direction: NL → EN</button></div></main>
<audio id="aud" preload="none"></audio><script src="app.js"></script></body></html>
